<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1a1433"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1150" cy="90" r="220" fill="#7dd3fc" opacity="0.07"/>
  <circle cx="180" cy="560" r="260" fill="#a78bfa" opacity="0.06"/>
  <text x="80" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" letter-spacing="6" fill="#7dd3fc">FALSIFY · 证伪引擎</text>
  <text x="80" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#e6edf3">Falsify before you believe.</text>
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="40" font-weight="600" fill="#a78bfa">先证伪，再相信；先标不确定，再下结论。</text>
  <rect x="80" y="330" width="640" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#e6edf3">NO VERDICT WITHOUT A</text>
  <text x="80" y="446" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#e6edf3">FALSIFIABLE HYPOTHESIS.</text>
  <text x="80" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#8b949e">公理 → 假设 → 对抗 → 验证 → 收束 · 5-stage scientific thinking protocol for AI agents</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8b949e">
    <text x="80" y="585">28/28 evals passed</text>
    <text x="330" y="585">4/4 external cross-validation</text>
    <text x="760" y="585">3/3 ground-truth matched</text>
  </g>
  <text x="1040" y="585" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#7dd3fc">github.com/263311487-ux/falsify</text>
