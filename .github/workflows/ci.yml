name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consistency gate (copies, versions, package files)
        run: |
          python3 .github/check_consistency.py
      - name: Check README mentions install
        run: grep -q "npx skills add" README.md && echo "README install OK"
      - name: Deterministic core and CLI regression tests
        run: node tests/regression.mjs
      - name: Validate historical report provenance
        run: |
          python3 .github/check_provenance.py
          python3 -O .github/check_provenance.py
          python3 tests/provenance-regression.py
      - name: Isolated package smoke test
        run: npm run test:package
